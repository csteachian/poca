{% extends "base.html" %}

{% block title %}{{ article.title }} - Pocket Clone{% endblock %}

{% block content %}
<div class="article-view">
    <div class="article-header">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
    
    <div class="article-details">
        <h1>{{ article.title }}</h1>
        <div class="article-meta">
            <p><strong>URL:</strong> 
                <a href="{{ article.url }}" target="_blank" rel="noopener noreferrer">
                    {{ article.url }}
                </a>
            </p>
            <p><strong>Saved on:</strong> {{ article.added_at }}</p>
        </div>
        
        <div class="article-actions">
            <a href="{{ article.url }}" target="_blank" class="btn btn-primary">Open Article</a>
            <a href="{{ url_for('delete_article', article_id=article.id) }}" 
               class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete this article?')">Delete Article</a>
        </div>
    </div>
</div>
{% endblock %}
